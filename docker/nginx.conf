# build.format: 'file' + trailingSlash: 'never' → /sobre-mi se sirve desde sobre-mi.html
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # /proyectos/ → /proyectos (sin barra final, como las URLs canónicas)
  rewrite ^/(.+)/$ /$1 permanent;

  location / {
    try_files $uri $uri.html =404;
  }

  location = / {
    try_files /index.html =404;
  }

  # Assets con hash en el nombre: caché para siempre
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Datos del modo terminal: no es una página
  location = /tui.json {
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri =404;
  }

  location /og/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location ~* \.(html|json|xml|txt)$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  error_page 404 /404.html;
}
